name: Build HoTClient64 (Windows, Linux, macOS)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Wipe the CMake cache and configure from scratch'
        type: boolean
        default: false
jobs:
  build:
    runs-on: [windows]
    defaults:
      run:
        shell: powershell
    env:
      CLIENTDIR: ${{ vars.CLIENTDIR }}
      PATCHDIR: ${{ vars.PATCHDIR }}
      MANIFESTDIR: ${{ vars.MANIFESTDIR }}
      SOAPDIR: ${{ vars.SOAPDIR }}
      PERSIST_DIR: ${{ vars.PERSIST_DIR }}
      # Outside the checkout so the checkout's clean does not throw the sysroots away.
      WOWDECOMP_CROSS_DIR: ${{ vars.PERSIST_DIR }}\cross
    steps:
      - name: Link persistent source directory
        run: |
          $persistentPath = "$env:PERSIST_DIR\source"
          $workspaceSource = "$env:GITHUB_WORKSPACE\source"
          if (-Not (Test-Path $persistentPath)) {
              New-Item -ItemType Directory -Path $persistentPath -Force | Out-Null
          }
          if (-Not (Test-Path $workspaceSource)) {
              New-Item -ItemType Junction -Path $workspaceSource -Target $persistentPath | Out-Null
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: source
          submodules: recursive

      - name: Configure
        run: |
          $sourceDir = "$env:PERSIST_DIR\source"
          $buildDir = "$env:PERSIST_DIR\build"
          $cmakeArgs = @(
            '-S', $sourceDir,
            '-B', $buildDir,
            '-G', 'Visual Studio 18 2026',
            '-A', 'x64',
            '-DWOWCLIENT_OUTPUT_OVERRIDE=HoTClient64',
            '-DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=1',
            '-DWOWCLIENT_FREEZE_DETECTOR=1',
            '-DWOWCLIENT_CRASH_LOG=1'
          )
          $fresh = '${{ github.event.inputs.fresh }}' -eq 'true'
          $cache = "$buildDir\CMakeCache.txt"
          if (-Not $fresh -and (Test-Path $cache)) {
              $cached = Select-String -Path $cache -Pattern '^CMAKE_HOME_DIRECTORY:INTERNAL=(.*)$' | Select-Object -First 1
              $wanted = (Resolve-Path $sourceDir).Path.Replace('\', '/').TrimEnd('/')
              if ($cached -and $cached.Matches[0].Groups[1].Value.TrimEnd('/') -ne $wanted) { $fresh = $true }
          }
          if ($fresh) { $cmakeArgs += '--fresh' }
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with exit code $LASTEXITCODE" }

      - name: Build
        run: |
          cmake --build "$env:PERSIST_DIR\build" --config Release --target WowClient --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed with exit code $LASTEXITCODE" }

      - name: Prepare cross sysroots
        run: |
          if (-Not (Test-Path "$env:WOWDECOMP_CROSS_DIR\linux-x86_64\usr\include\stdio.h")) {
            python source\Tools\Cross\cross.py sysroot linux
            if ($LASTEXITCODE -ne 0) { throw "linux sysroot failed with exit code $LASTEXITCODE" }
          }
          $macos = @(
            "$env:WOWDECOMP_CROSS_DIR\macos\Frameworks\SDL2.framework",
            "$env:WOWDECOMP_CROSS_DIR\macos\deps-arm64\lib",
            "$env:WOWDECOMP_CROSS_DIR\macos\deps-x86_64\lib"
          )
          $sdk = Get-ChildItem "source\ThirdParty\macos-sdk\*.sdk\usr\include\stdio.h" -ErrorAction SilentlyContinue
          if (-Not $sdk -or ($macos | Where-Object { -Not (Test-Path $_) })) {
            python source\Tools\Cross\cross.py sysroot macos
            if ($LASTEXITCODE -ne 0) { throw "macos sysroot failed with exit code $LASTEXITCODE" }
          }

      - name: Build Linux
        run: |
          $fresh = @()
          if ('${{ github.event.inputs.fresh }}' -eq 'true') { $fresh = @('--fresh') }
          python source\Tools\Cross\cross.py build linux --config Release --build-dir "$env:PERSIST_DIR\build-linux" @fresh -- -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=1
          if ($LASTEXITCODE -ne 0) { throw "linux build failed with exit code $LASTEXITCODE" }

      - name: Build macOS
        run: |
          $fresh = @()
          if ('${{ github.event.inputs.fresh }}' -eq 'true') { $fresh = @('--fresh') }
          foreach ($arch in "arm64", "x86_64") {
            python source\Tools\Cross\cross.py build "macos-$arch" --config Release --build-dir "$env:PERSIST_DIR\build-macos-$arch" @fresh -- -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=1
            if ($LASTEXITCODE -ne 0) { throw "macos-$arch build failed with exit code $LASTEXITCODE" }
          }
          python source\Tools\Cross\cross.py package macos --no-build
          if ($LASTEXITCODE -ne 0) { throw "macos package failed with exit code $LASTEXITCODE" }

      - name: Copy binaries
        run: |
          foreach ($dest in "$env:CLIENTDIR\_DO_NOT_PACKAGE\Assets\Binaries", "$env:PATCHDIR") {
            foreach ($f in "HoTClient64.exe", "discord_game_sdk_64.dll", "XvidDecoder.dll") {
              Copy-Item -Path "source\bin\Win\$f" -Destination "$dest\$f" -Force
            }
            Copy-Item -Path "source\bin\Linux\Wow64" -Destination "$dest\HoTClient64" -Force
            Copy-Item -Path "source\bin\Wow64-mac.tar.gz" -Destination "$dest\HoTClient64-mac.tar.gz" -Force
          }

      - name: Run manifest tool
        run: |
          Push-Location "$env:MANIFESTDIR"
          cmd.exe /c "Run.bat"
          Pop-Location

      - name: Trigger streamall
        continue-on-error: true
        run: |
          Push-Location "$env:SOAPDIR"
          cmd.exe /c "SoapCommand.exe dev streamall"
          Pop-Location

      - name: Publish executable builds
        continue-on-error: true
        run: |
          $sha = (git -C source rev-parse HEAD).Trim().ToLower()
          Push-Location "$env:SOAPDIR"
          # The Mac binary is universal, both of its slices carry this commit.
          foreach ($platform in "Wn64", "Lx64", "Mc64", "MacA") {
            Write-Host "Publishing $platform build $sha"
            & ".\SoapCommand.exe" dev "publishexe $platform $sha"
            if ($LASTEXITCODE -ne 0) { throw "SoapCommand.exe failed for $platform with exit code $LASTEXITCODE" }
          }
          Pop-Location

      - name: Commit and push
        run: |
          Push-Location "$env:CLIENTDIR"
          git add _DO_NOT_PACKAGE\Assets\Binaries\HoTClient64.exe _DO_NOT_PACKAGE\Assets\Binaries\discord_game_sdk_64.dll _DO_NOT_PACKAGE\Assets\Binaries\XvidDecoder.dll _DO_NOT_PACKAGE\Assets\Binaries\HoTClient64 _DO_NOT_PACKAGE\Assets\Binaries\HoTClient64-mac.tar.gz
          git commit -m "Update HoTClient64 (Windows, Linux, macOS)"
          git push
          Pop-Location
