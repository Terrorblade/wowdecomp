name: Build HoTClient64
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Wipe the CMake cache and configure from scratch'
        type: boolean
        default: false
jobs:
  build:
    runs-on: [windows]
    defaults:
      run:
        shell: powershell
    env:
      CLIENTDIR: ${{ vars.CLIENTDIR }}
      PATCHDIR: ${{ vars.PATCHDIR }}
      MANIFESTDIR: ${{ vars.MANIFESTDIR }}
      SOAPDIR: ${{ vars.SOAPDIR }}
      PERSIST_DIR: ${{ vars.PERSIST_DIR }}
    steps:
      - name: Link persistent source directory
        run: |
          $persistentPath = "$env:PERSIST_DIR\source"
          $workspaceSource = "$env:GITHUB_WORKSPACE\source"
          if (-Not (Test-Path $persistentPath)) {
              New-Item -ItemType Directory -Path $persistentPath -Force | Out-Null
          }
          if (-Not (Test-Path $workspaceSource)) {
              New-Item -ItemType Junction -Path $workspaceSource -Target $persistentPath | Out-Null
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: source
          submodules: recursive

      - name: Configure
        run: |
          $sourceDir = "$env:PERSIST_DIR\source"
          $buildDir = "$env:PERSIST_DIR\build"
          $cmakeArgs = @(
            '-S', $sourceDir,
            '-B', $buildDir,
            '-G', 'Visual Studio 18 2026',
            '-A', 'x64',
            '-DWOWCLIENT_OUTPUT_OVERRIDE=HoTClient64',
            '-DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=1',
            '-DWOWCLIENT_FREEZE_DETECTOR=1',
            '-DWOWCLIENT_CRASH_LOG=1'
          )
          $fresh = '${{ github.event.inputs.fresh }}' -eq 'true'
          $cache = "$buildDir\CMakeCache.txt"
          if (-Not $fresh -and (Test-Path $cache)) {
              $cached = Select-String -Path $cache -Pattern '^CMAKE_HOME_DIRECTORY:INTERNAL=(.*)$' | Select-Object -First 1
              $wanted = (Resolve-Path $sourceDir).Path.Replace('\', '/').TrimEnd('/')
              if ($cached -and $cached.Matches[0].Groups[1].Value.TrimEnd('/') -ne $wanted) { $fresh = $true }
          }
          if ($fresh) { $cmakeArgs += '--fresh' }
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with exit code $LASTEXITCODE" }

      - name: Build
        run: |
          cmake --build "$env:PERSIST_DIR\build" --config Release --target WowClient --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed with exit code $LASTEXITCODE" }

      - name: Copy binaries
        run: |
          foreach ($f in "HoTClient64.exe", "discord_game_sdk_64.dll", "XvidDecoder.dll") {
            Copy-Item -Path "source\bin\Win\$f" -Destination "$env:CLIENTDIR\_DO_NOT_PACKAGE\Assets\Binaries\$f" -Force
          }

      - name: Copy binaries to patch directory
        run: |
          foreach ($f in "HoTClient64.exe", "discord_game_sdk_64.dll", "XvidDecoder.dll") {
            Copy-Item -Path "source\bin\Win\$f" -Destination "$env:PATCHDIR\$f" -Force
          }

      - name: Run manifest tool
        run: |
          Push-Location "$env:MANIFESTDIR"
          cmd.exe /c "Run.bat"
          Pop-Location

      - name: Trigger streamall
        continue-on-error: true
        run: |
          Push-Location "$env:SOAPDIR"
          cmd.exe /c "SoapCommand.exe dev streamall"
          Pop-Location

      - name: Publish executable build
        continue-on-error: true
        run: |
          $sha = (git -C source rev-parse HEAD).Trim().ToLower()
          Write-Host "Publishing Wn64 build $sha"
          Push-Location "$env:SOAPDIR"
          & ".\SoapCommand.exe" dev "publishexe Wn64 $sha"
          if ($LASTEXITCODE -ne 0) { throw "SoapCommand.exe failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Commit and push
        run: |
          Push-Location "$env:CLIENTDIR"
          git add _DO_NOT_PACKAGE\Assets\Binaries\HoTClient64.exe _DO_NOT_PACKAGE\Assets\Binaries\discord_game_sdk_64.dll _DO_NOT_PACKAGE\Assets\Binaries\XvidDecoder.dll
          git commit -m "Update HoTClient64.exe"
          git push
          Pop-Location
